[project]
name = "ai-song-chords"
version = "0.1.0"
description = "Transcription locale des accords et paroles d'une chanson"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.4",
    "librosa>=0.10",
    "numpy",
    "pyyaml",
    "faster-whisper>=1.2.1",
    "mlx-whisper>=0.4.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "joblib>=1.6.0",
    "pydub>=0.25.1",
    "h5py>=3.16.0",
    "pretty-midi>=0.2.11.post0",
    "demucs>=4.0.1",
]
